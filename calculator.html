<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculator</title>
  <style>
    :root{--bg:#0f1724;--panel:#0b1220;--accent:#f59e0b;--muted:#9aa4b2;--btn:#1f2937}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071128 0%, #07193a 100%);font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    .card{width:320px;background:var(--panel);border-radius:12px;padding:18px;box-shadow:0 8px 30px rgba(2,6,23,.6);color:#e6eef8}
    .display{height:64px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;font-size:20px}
    .sub{color:var(--muted);font-size:12px;min-height:16px}
    .main{font-weight:600;font-size:22px;word-break:break-all}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
    button{height:52px;border-radius:8px;border:0;background:var(--btn);color:#e6eef8;font-size:18px;cursor:pointer;transition:transform .06s,box-shadow .06s}
    button:active{transform:translateY(1px)}
    .btn-op{background:transparent;border:1px solid rgba(255,255,255,.04);color:var(--accent)}
    .btn-eq{grid-column:span 2;background:var(--accent);color:#061021;font-weight:700}
    .btn-zero{grid-column:span 2;text-align:left;padding-left:18px}
    .small{font-size:14px}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <main class="card" role="application" aria-label="Calculator">
    <div class="display" aria-live="polite">
      <div id="sub" class="sub muted">&nbsp;</div>
      <div id="main" class="main">0</div>
    </div>

    <div class="grid" role="group" aria-label="Calculator buttons">
      <button type="button" class="btn-op" data-action="clear">C</button>
      <button type="button" class="btn-op" data-action="back">←</button>
      <button type="button" class="btn-op" data-value="%">%</button>
      <button type="button" class="btn-op" data-value="/">÷</button>

      <button type="button" data-value="7">7</button>
      <button type="button" data-value="8">8</button>
      <button type="button" data-value="9">9</button>
      <button type="button" class="btn-op" data-value="*">×</button>

      <button type="button" data-value="4">4</button>
      <button type="button" data-value="5">5</button>
      <button type="button" data-value="6">6</button>
      <button type="button" class="btn-op" data-value="-">−</button>

      <button type="button" data-value="1">1</button>
      <button type="button" data-value="2">2</button>
      <button type="button" data-value="3">3</button>
      <button type="button" class="btn-op" data-value="+">+</button>

      <button type="button" class="btn-zero" data-value="0">0</button>
      <button type="button" data-value=".">.</button>
      <button type="button" class="btn-eq" data-action="equals">=</button>
    </div>

    <p style="margin-top:12px;font-size:12px;color:var(--muted)">Keyboard: numbers, + - * /, Enter to evaluate, Backspace to delete, Esc to clear.</p>
  </main>

  <script>
    (function(){
      const main = document.getElementById('main');
      const sub = document.getElementById('sub');
      let expr = '';

      function update(){
        main.textContent = expr === '' ? '0' : expr;
        sub.textContent = expr === '' ? '\u00A0' : expr;
      }

      function append(value){
        // prevent multiple leading zeros
        if(expr === '0' && /[0-9]/.test(value)) expr = value;
        else expr += value;
        update();
      }

      function clearAll(){ expr = ''; update(); }
      function back(){ expr = expr.slice(0,-1); update(); }

      function safeEvaluate(s){
        // allow digits, operators, parentheses, decimal and percent and spaces
        if(!/^[0-9+\-*/().% \u00A0]*$/.test(s)) throw new Error('Invalid characters');
        // convert percentage usage: replace 'number%' with '(number/100)'
        // simple approach: replace occurrences of n% with (n/100)
        s = s.replace(/(\d+(?:\.\d+)?)%/g, '($1/100)');
        // replace unicode minus/div/multiply symbols if any
        s = s.replace(/÷/g, '/').replace(/×/g, '*').replace(/−/g, '-');
        // final safety check - no consecutive operators like ++ or */
        if(/[+\-*/]{2,}/.test(s.replace(/\s+/g,''))) {
          // allow leading negative like (-3)...
          // we'll still try but may error out
        }
        // Use Function instead of eval for slightly safer evaluation
        // This still executes JS code; we've validated allowed characters above.
        // Wrap in parentheses to allow leading unary operators.
        return Function('return (' + s + ')')();
      }

      function equals(){
        if(expr.trim() === '') return;
        try{
          const val = safeEvaluate(expr);
          expr = String(val);
          update();
        }catch(e){
          main.textContent = 'Error';
          console.error(e);
          setTimeout(()=>{ update(); }, 800);
        }
      }

      document.querySelectorAll('[data-value]').forEach(btn=>{
        btn.addEventListener('click', ()=> append(btn.getAttribute('data-value')));
      });

      document.querySelectorAll('[data-action]').forEach(btn=>{
        const action = btn.getAttribute('data-action');
        btn.addEventListener('click', ()=>{
          if(action === 'clear') clearAll();
          else if(action === 'back') back();
          else if(action === 'equals') equals();
        });
      });

      // keyboard support
      window.addEventListener('keydown', (ev)=>{
        const k = ev.key;
        if(k === 'Enter') { ev.preventDefault(); equals(); return; }
        if(k === 'Escape') { clearAll(); return; }
        if(k === 'Backspace') { back(); return; }
        if(/^[0-9]$/.test(k) || k === '.') { append(k); return; }
        if(['+','-','*','/','%','(',')'].includes(k)) { append(k); return; }
      });

      update();
    })();
  </script>
</body>
</html>
